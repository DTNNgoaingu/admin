<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Hồ sơ | FFl Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4fbf5; color: #2e3d32; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 40px; box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
        h2 { color: #2e7d32; margin-bottom: 25px; border-bottom: 4px solid #ffca28; display: inline-block; padding-bottom: 8px; }
        .table-responsive { width: 100%; overflow-x: auto; border-radius: 20px; border: 2px solid #e8f5e9; }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #e8f5e9; font-size: 14px; }
        th { background-color: #2e7d32; color: #fff; font-weight: bold; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: #f4fbf5; }
        .mini-btn { padding: 6px 14px; background: #ffca28; color: #1b5e20; text-decoration: none; border-radius: 20px; font-weight: bold; font-size: 12px; display: inline-block; }
        .mini-btn:hover { background: #ffb300; }
        .review-box { display: flex; gap: 10px; align-items: center; }
        select, input[type="text"] { padding: 8px 12px; border-radius: 20px; border: 2px solid #e8f5e9; outline: none; font-size: 13px; background: #f9fdf9; }
        select:focus, input[type="text"]:focus { border-color: #81c784; }
        .save-eval-btn { padding: 8px 16px; background: #2e7d32; color: white; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .save-eval-btn:hover { background: #1b5e20; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Quản lý và Xét duyệt hồ sơ Khoa</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Họ tên</th>
                        <th>MSSV</th>
                        <th>Lớp</th>
                        <th>SĐT</th>
                        <th>Ngành học</th>
                        <th>Địa chỉ</th>
                        <th>Email</th>
                        <th>Chức vụ</th>
                        <th>Danh hiệu</th>
                        <th>Minh chứng</th>
                        <th>Tình hình xét duyệt & Lý do</th>
                    </tr>
                </thead>
                <tbody id="dataList">
                    <!-- Dữ liệu tự động đổ về từ hệ thống -->
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD3VeuDPJz4iW8JWHBmz5sm-1SdFj-Nn4M",
            authDomain: "xet-danh-hieu.firebaseapp.com",
            projectId: "xet-danh-hieu",
            storageBucket: "xet-danh-hieu.firebasestorage.app",
            messagingSenderId: "147503377943",
            appId: "1:147503377943:web:4181e69a0d963bcba77652",
            measurementId: "G-0EQY61G439"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const dataList = document.getElementById("dataList");

        const q = query(collection(db, "HoSo_BaoMat"), orderBy("thoi_gian", "desc"));
        onSnapshot(q, (snapshot) => {
            dataList.innerHTML = "";
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const docId = docSnap.id;
                
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><strong>${data.ho_ten}</strong></td>
                    <td>${data.mssv}</td>
                    <td>${data.lop}</td>
                    <td>${data.sdt}</td>
                    <td>${data.nganh}</td>
                    <td>${data.dia_chi}</td>
                    <td>${data.email}</td>
                    <td>${data.chuc_vu || "Không có"}</td>
                    <td><strong>${data.danh_hieu}</strong></td>
                    <td><a href="${data.link_drive}" target="_blank" class="mini-btn">Mở tệp</a></td>
                    <td>
                        <div class="review-box">
                            <select class="status-select" data-id="${docId}">
                                <option value="Chưa duyệt" ${data.trang_thai === 'Chưa duyệt' ? 'selected' : ''}>Chưa duyệt</option>
                                <option value="Đã duyệt" ${data.trang_thai === 'Đã duyệt' ? 'selected' : ''}>Đã duyệt</option>
                                <option value="Không duyệt" ${data.trang_thai === 'Không duyệt' ? 'selected' : ''}>Không duyệt</option>
                            </select>
                            <input type="text" class="reason-input" data-id="${docId}" placeholder="Nhập lý do..." value="${data.ly_do || ''}">
                            <button class="save-eval-btn" data-id="${docId}">Lưu kết quả</button>
                        </div>
                    </td>
                `;
                dataList.appendChild(tr);
            });

            document.querySelectorAll('.save-eval-btn').forEach(button => {
                button.addEventListener('click', async (e) => {
                    const id = e.target.getAttribute('data-id');
                    const row = e.target.closest('.review-box');
                    const trangThai = row.querySelector('.status-select').value;
                    const lyDo = row.querySelector('.reason-input').value;
                    
                    try {
                        const docRefBaoMat = doc(db, "HoSo_BaoMat", id);
                        await updateDoc(docRefBaoMat, { trang_thai: trangThai, ly_do: lyDo });

                        const docRefCongKhai = doc(db, "HoSo_CongKhai", id);
                        await updateDoc(docRefCongKhai, { trang_thai: trangThai, ly_do: lyDo });

                        alert("Đã lưu và đồng bộ thành công!");
                    } catch (error) {
                        console.error("Lỗi cập nhật: ", error);
                        alert("Không thể lưu. Vui lòng kiểm tra lại kết nối.");
                    }
                });
            });
        });
    </script>
</body>
</html>
