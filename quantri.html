<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Hệ thống | FFL Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); color: #2d3748; padding: 30px; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; background: #ffffff; padding: 40px; border-radius: 30px; box-shadow: 0 10px 30px rgba(22, 101, 52, 0.08); border: 2px solid #bbf7d0; }
        
        .tab-header { display: flex; gap: 15px; margin-bottom: 25px; border-bottom: 2px solid #bbf7d0; padding-bottom: 15px; }
        .tab-btn { padding: 12px 28px; background: #f0fdf4; color: #166534; border: 2px solid #bbf7d0; border-radius: 20px; font-weight: 900; font-size: 15px; cursor: pointer; transition: all 0.3s; }
        .tab-btn.active { background: linear-gradient(135deg, #166534 0%, #22c55e 100%); color: #fef08a; border-color: #22c55e; box-shadow: 0 4px 15px rgba(22, 101, 52, 0.2); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        h2 { color: #166534; margin-bottom: 22px; border-bottom: 4px solid #eab308; display: inline-block; padding-bottom: 6px; font-size: 1.5rem; font-weight: 900; }
        .table-responsive { width: 100%; overflow-x: auto; border-radius: 20px; border: 2px solid #bbf7d0; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th, td { padding: 18px 20px; text-align: left; border-bottom: 1px solid #e5e7eb; font-size: 14px; }
        th { background: linear-gradient(135deg, #166534 0%, #15803d 100%); color: #fef08a; font-weight: 900; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: #f0fdf4; }
        
        .mini-btn { padding: 8px 16px; background: linear-gradient(135deg, #22c55e 0%, #15803d 50%, #eab308 100%); color: #ffffff; text-decoration: none; border-radius: 15px; font-weight: 900; font-size: 12px; display: inline-block; box-shadow: 0 3px 10px rgba(34, 197, 94, 0.3); }
        .mini-btn:hover { transform: scale(1.05); }
        
        .review-box { display: flex; gap: 10px; align-items: center; }
        select, input[type="text"] { padding: 10px 16px; border-radius: 15px; border: 2px solid #bbf7d0; outline: none; font-size: 13px; background: #fafdf9; font-weight: 700; color: #1f2937; }
        select:focus, input[type="text"]:focus { border-color: #22c55e; background: #fff; box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15); }
        
        .save-eval-btn { padding: 10px 20px; background: linear-gradient(135deg, #166534 0%, #15803d 100%); color: #fef08a; border: none; border-radius: 15px; font-weight: 900; cursor: pointer; font-size: 13px; box-shadow: 0 3px 10px rgba(22, 101, 52, 0.2); }
        .save-eval-btn:hover { background: #166534; }

        .add-dd-box { background: #f0fdf4; padding: 22px; border-radius: 25px; border: 2px solid #bbf7d0; margin-bottom: 25px; display: flex; gap: 15px; align-items: center; }
        .add-dd-box input, .add-dd-box select { flex: 1; padding: 14px 20px; border-radius: 20px; border: 2px solid #bbf7d0; outline: none; font-size: 14px; background: #fff; font-weight: 700; color: #1f2937; }
        .add-dd-btn { padding: 14px 30px; background: linear-gradient(135deg, #22c55e 0%, #15803d 50%, #eab308 100%); color: #ffffff; border: none; border-radius: 20px; font-weight: 900; cursor: pointer; font-size: 14px; box-shadow: 0 4px 15px rgba(34, 197, 94, 0.35); }
        .add-dd-btn:hover { transform: scale(1.03); }
        
        .delete-btn { padding: 8px 14px; background: #fee2e2; color: #991b1b; border: 2px solid #fecaca; border-radius: 15px; font-weight: 900; cursor: pointer; font-size: 12px; }
        .delete-btn:hover { background: #fecaca; }
    </style>
</head>
<body>

    <div class="container">
        <div class="tab-header">
            <button class="tab-btn active" onclick="chuyenTab('tabHoSo')">Xét duyệt hồ sơ</button>
            <button class="tab-btn" onclick="chuyenTab('tabDiemDanh')">Quản lý điểm danh</button>
        </div>

        <!-- TAB 1: XÉT DUYỆT HỒ SƠ -->
        <div id="tabHoSo" class="tab-content active">
            <h2>Quản lý và Xét duyệt hồ sơ Khoa</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Họ tên</th>
                            <th>MSSV</th>
                            <th>Lớp</th>
                            <th>SĐT</th>
                            <th>Ngành học</th>
                            <th>Địa chỉ</th>
                            <th>Email</th>
                            <th>Chức vụ</th>
                            <th>Danh hiệu</th>
                            <th>Minh chứng</th>
                            <th>Tình hình xét duyệt & Lý do</th>
                        </tr>
                    </thead>
                    <tbody id="dataList"></tbody>
                </table>
            </div>
        </div>

        <!-- TAB 2: QUẢN LÝ ĐIỂM DANH -->
        <div id="tabDiemDanh" class="tab-content">
            <h2>Điểm danh nhanh theo hoạt động</h2>
            
            <form id="adminDiemDanhForm" class="add-dd-box">
                <select id="chonHoatDong" required>
                    <option value="" disabled selected>-- Chọn hoạt động --</option>
                    <option value="DiemDanh_HD1">Ngày hội CLB khoa NN</option>
                    <option value="DiemDanh_HD2">Lễ đón TSV K26</option>
                </select>
                <input type="text" id="adminMssv" placeholder="Nhập Mã số sinh viên (MSSV)..." required>
                <button type="submit" class="add-dd-btn">Thêm điểm danh</button>
            </form>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 25px;">
                <div>
                    <h3 style="color: #166534; margin-bottom: 12px; font-size: 1.15rem; font-weight: 900;">Ngày hội CLB khoa NN</h3>
                    <div class="table-responsive" style="margin-top: 0;">
                        <table>
                            <thead>
                                <tr>
                                    <th>MSSV</th>
                                    <th>Thời gian</th>
                                    <th>Xóa</th>
                                </tr>
                            </thead>
                            <tbody id="adminListHD1"></tbody>
                        </table>
                    </div>
                </div>
                <div>
                    <h3 style="color: #166534; margin-bottom: 12px; font-size: 1.15rem; font-weight: 900;">Lễ đón TSV K26</h3>
                    <div class="table-responsive" style="margin-top: 0;">
                        <table>
                            <thead>
                                <tr>
                                    <th>MSSV</th>
                                    <th>Thời gian</th>
                                    <th>Xóa</th>
                                </tr>
                            </thead>
                            <tbody id="adminListHD2"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function chuyenTab(idTab) {
            document.getElementById('tabHoSo').classList.remove('active');
            document.getElementById('tabDiemDanh').classList.remove('active');
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(idTab).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, doc, updateDoc, addDoc, deleteDoc, getDocs, where } 
        from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD3VeuDPJz4iW8JWHBmz5sm-1SdFj-Nn4M",
            authDomain: "xet-danh-hieu.firebaseapp.com",
            projectId: "xet-danh-hieu",
            storageBucket: "xet-danh-hieu.firebasestorage.app",
            messagingSenderId: "147503377943",
            appId: "1:147503377943:web:4181e69a0d963bcba77652",
            measurementId: "G-0EQY61G439"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const dataList = document.getElementById("dataList");
        const qHoSo = query(collection(db, "HoSo_BaoMat"), orderBy("thoi_gian", "desc"));
        onSnapshot(qHoSo, (snapshot) => {
            dataList.innerHTML = "";
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const docId = docSnap.id;
                
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><strong>${data.ho_ten}</strong></td>
                    <td>${data.mssv}</td>
                    <td>${data.lop}</td>
                    <td>${data.sdt}</td>
                    <td>${data.nganh}</td>
                    <td>${data.dia_chi}</td>
                    <td>${data.email}</td>
                    <td>${data.chuc_vu || "Không có"}</td>
                    <td><strong>${data.danh_hieu}</strong></td>
                    <td><a href="${data.link_drive}" target="_blank" class="mini-btn">Mở tệp</a></td>
                    <td>
                        <div class="review-box">
                            <select class="status-select" data-id="${docId}">
                                <option value="Chưa duyệt" ${data.trang_thai === 'Chưa duyệt' ? 'selected' : ''}>Chưa duyệt</option>
                                <option value="Đã duyệt" ${data.trang_thai === 'Đã duyệt' ? 'selected' : ''}>Đã duyệt</option>
                                <option value="Không duyệt" ${data.trang_thai === 'Không duyệt' ? 'selected' : ''}>Không duyệt</option>
                            </select>
                            <input type="text" class="reason-input" data-id="${docId}" placeholder="Nhập lý do..." value="${data.ly_do || ''}">
                            <button class="save-eval-btn" data-id="${docId}">Lưu kết quả</button>
                        </div>
                    </td>
                `;
                dataList.appendChild(tr);
            });

            document.querySelectorAll('.save-eval-btn').forEach(button => {
                button.addEventListener('click', async (e) => {
                    const id = e.target.getAttribute('data-id');
                    const row = e.target.closest('.review-box');
                    const trangThai = row.querySelector('.status-select').value;
                    const lyDo = row.querySelector('.reason-input').value;
                    
                    try {
                        await updateDoc(doc(db, "HoSo_BaoMat", id), { trang_thai: trangThai, ly_do: lyDo });
                        await updateDoc(doc(db, "HoSo_CongKhai", id), { trang_thai: trangThai, ly_do: lyDo });
                        alert("Đã lưu và đồng bộ thành công!");
                    } catch (error) {
                        alert("Không thể lưu. Vui lòng kiểm tra lại kết nối.");
                    }
                });
            });
        });

        const adminDiemDanhForm = document.getElementById("adminDiemDanhForm");
        adminDiemDanhForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const collectionName = document.getElementById("chonHoatDong").value;
            const mssvInput = document.getElementById("adminMssv").value.trim();

            const checkQuery = query(collection(db, collectionName), where("mssv", "==", mssvInput));
            const snapshot = await getDocs(checkQuery);
            if (!snapshot.empty) {
                alert("Mã số sinh viên này đã có trong danh sách của hoạt động này rồi!");
                return;
            }

            try {
                await addDoc(collection(db, collectionName), {
                    mssv: mssvInput,
                    thoi_gian: new Date()
                });
                document.getElementById("adminMssv").value = "";
                alert("Thêm điểm danh thành công!");
            } catch (error) {
                alert("Lỗi kết nối hệ thống.");
            }
        });

        const adminListHD1 = document.getElementById("adminListHD1");
        onSnapshot(query(collection(db, "DiemDanh_HD1"), orderBy("thoi_gian", "desc")), (snapshot) => {
            adminListHD1.innerHTML = "";
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const docId = docSnap.id;
                let thoiGianStr = data.thoi_gian ? data.thoi_gian.toDate().toLocaleTimeString('vi-VN') + " - " + data.thoi_gian.toDate().toLocaleDateString('vi-VN') : "";
                const tr = document.createElement("tr");
                tr.innerHTML = `<td><strong>${data.mssv}</strong></td><td>${thoiGianStr}</td><td><button class="delete-btn" onclick="xoaDiemDanh('DiemDanh_HD1', '${docId}')">Xóa</button></td>`;
                adminListHD1.appendChild(tr);
            });
        });

        const adminListHD2 = document.getElementById("adminListHD2");
        onSnapshot(query(collection(db, "DiemDanh_HD2"), orderBy("thoi_gian", "desc")), (snapshot) => {
            adminListHD2.innerHTML = "";
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const docId = docSnap.id;
                let thoiGianStr = data.thoi_gian ? data.thoi_gian.toDate().toLocaleTimeString('vi-VN') + " - " + data.thoi_gian.toDate().toLocaleDateString('vi-VN') : "";
                const tr = document.createElement("tr");
                tr.innerHTML = `<td><strong>${data.mssv}</strong></td><td>${thoiGianStr}</td><td><button class="delete-btn" onclick="xoaDiemDanh('DiemDanh_HD2', '${docId}')">Xóa</button></td>`;
                adminListHD2.appendChild(tr);
            });
        });

        window.xoaDiemDanh = async function(colName, id) {
            if (confirm("Bạn có chắc chắn muốn xóa sinh viên này?")) {
                await deleteDoc(doc(db, colName, id));
            }
        }
    </script>
</body>
</html>
