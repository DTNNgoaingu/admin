<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, doc, updateDoc, getDocs, where } 
        from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD3VeuDPJz4iW8JWHBmz5sm-1SdFj-Nn4M",
            authDomain: "xet-danh-hieu.firebaseapp.com",
            projectId: "xet-danh-hieu",
            storageBucket: "xet-danh-hieu.firebasestorage.app",
            messagingSenderId: "147503377943",
            appId: "1:147503377943:web:4181e69a0d963bcba77652",
            measurementId: "G-0EQY61G439"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const dataList = document.getElementById("dataList");

        const q = query(collection(db, "HoSo_BaoMat"), orderBy("thoi_gian", "desc"));
        onSnapshot(q, (snapshot) => {
            dataList.innerHTML = "";
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const docId = docSnap.id;
                
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><strong>${data.ho_ten}</strong></td>
                    <td>${data.mssv}</td>
                    <td>${data.lop}</td>
                    <td>${data.sdt}</td>
                    <td>${data.nganh}</td>
                    <td>${data.dia_chi}</td>
                    <td>${data.email}</td>
                    <td>${data.chuc_vu || "Không có"}</td>
                    <td><strong>${data.danh_hieu}</strong></td>
                    <td><a href="${data.link_drive}" target="_blank" class="mini-btn">Mở tệp</a></td>
                    <td>
                        <div class="review-box">
                            <select class="status-select" data-id="${docId}">
                                <option value="Chưa duyệt" ${data.trang_thai === 'Chưa duyệt' ? 'selected' : ''}>Chưa duyệt</option>
                                <option value="Đã duyệt" ${data.trang_thai === 'Đã duyệt' ? 'selected' : ''}>Đã duyệt</option>
                                <option value="Không duyệt" ${data.trang_thai === 'Không duyệt' ? 'selected' : ''}>Không duyệt</option>
                            </select>
                            <input type="text" class="reason-input" data-id="${docId}" placeholder="Nhập lý do..." value="${data.ly_do || ''}">
                            <button class="save-eval-btn" data-id="${docId}" data-mssv="${data.mssv}">Lưu kết quả</button>
                        </div>
                    </td>
                `;
                dataList.appendChild(tr);
            });

            document.querySelectorAll('.save-eval-btn').forEach(button => {
                button.addEventListener('click', async (e) => {
                    const id = e.target.getAttribute('data-id');
                    const mssvGoc = e.target.getAttribute('data-mssv');
                    const row = e.target.closest('.review-box');
                    const trangThai = row.querySelector('.status-select').value;
                    const lyDo = row.querySelector('.reason-input').value;
                    
                    try {
                        // 1. Cập nhật bảng bảo mật
                        const docRef = doc(db, "HoSo_BaoMat", id);
                        await updateDoc(docRef, { 
                            trang_thai: trangThai, 
                            ly_do: lyDo 
                        });

                        // 2. Tìm dòng có cùng MSSV ở bảng công khai để cập nhật trạng thái hiển thị
                        const congKhaiQuery = query(collection(db, "HoSo_CongKhai"));
                        const querySnapshot = await getDocs(congKhaiQuery);
                        
                        querySnapshot.forEach(async (publicDoc) => {
                            const publicData = publicDoc.data();
                            // So khớp dựa vào 4 ký tự đầu mã số sinh viên đã ẩn
                            if (publicData.mssv_an && mssvGoc.startsWith(publicData.mssv_an.substring(0, 4))) {
                                const publicDocRef = doc(db, "HoSo_CongKhai", publicDoc.id);
                                await updateDoc(publicDocRef, { 
                                    trang_thai: trangThai, 
                                    ly_do: lyDo 
                                });
                            }
                        });

                        alert("Đã lưu và đồng bộ thành công!");
                    } catch (error) {
                        console.error("Lỗi cập nhật: ", error);
                        alert("Không thể lưu. Vui lòng kiểm tra lại kết nối.");
                    }
                });
            });
        });
    </script>
